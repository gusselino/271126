<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>271126 – nio lås</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050505;color:#c8f7c5;font:400 14px/1.5 ui-monospace,Menlo,Monaco,Consolas,monospace;text-shadow:0 0 7px rgba(120,255,140,.3);-webkit-tap-highlight-color:transparent}
main{max-width:460px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:14px;font-weight:400;opacity:.6;margin-bottom:6px}
.intro{opacity:.6;margin-bottom:26px;font-size:12.5px}
section{margin-bottom:44px}
h2{font-size:15px;font-weight:400;color:#eaffea;margin-bottom:2px}
.besk{font-size:12px;opacity:.55;margin-bottom:10px}
.lada{border:1px solid rgba(200,247,197,.45);padding:12px;background:#070907;user-select:none;-webkit-user-select:none;position:relative;overflow:hidden}
.lcd{background:#0c1a0d;border:1px solid rgba(200,247,197,.35);padding:10px 12px;min-height:58px;box-shadow:inset 0 0 14px rgba(0,0,0,.8);margin-bottom:12px;position:relative}
.lcd .led{position:absolute;right:8px;top:8px;width:7px;height:7px;border-radius:50%;background:#ff3b30;box-shadow:0 0 8px #ff3b30}
.lada.ok .led{background:#3dff6e;box-shadow:0 0 10px #3dff6e}
.fel{color:#ff6b5e;text-shadow:0 0 8px rgba(255,90,70,.6)}
.ratt{color:#eaffea;text-shadow:0 0 10px rgba(150,255,170,.9)}
.stor{font-size:30px;line-height:1.1;color:#eaffea;margin-top:6px}
button{font:inherit;color:inherit;background:#0a0d0a;border:1px solid rgba(200,247,197,.35);border-radius:4px;cursor:pointer;text-shadow:inherit;touch-action:manipulation}
button:active{background:#c8f7c5;color:#050505;text-shadow:none}
.om{margin-top:8px;background:none;border:0;opacity:.5;font-size:12px;padding:6px 0}
.lada.skak{animation:skak .45s}
@keyframes skak{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* 1 porttelefon */
.namnlista{display:grid;gap:6px}
.namnlista button{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;text-align:left}
.namnlista button i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(200,247,197,.5);font-style:normal}
.namnlista button:active i{background:#050505}

/* 2 rotationslås */
.ratt-ytan{display:flex;justify-content:center;padding:6px 0 4px}
.hjul{width:240px;height:240px;border-radius:50%;position:relative;touch-action:none;cursor:grab}
.hjul svg{width:100%;height:100%;display:block}
.markor{position:absolute;left:50%;top:-6px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid #eaffea;transform:translateX(-50%);filter:drop-shadow(0 0 6px #9f9)}
.mitt{position:absolute;inset:70px;border-radius:50%;border:1px solid rgba(200,247,197,.5);background:#0a0d0a;display:grid;place-items:center;font-size:12px;text-align:center}

/* 3 morse och 8 bildval: knappsats */
.knappar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.knappar button{font-size:21px;padding:12px 0}
.morselampa{width:34px;height:34px;border-radius:50%;margin:4px auto 0;background:#162616;border:1px solid rgba(200,247,197,.3);transition:background .05s}
.morselampa.pa{background:#eaffea;box-shadow:0 0 22px #9f9}

/* 4 rytm */
.platta{height:150px;display:grid;place-items:center;font-size:13px;border:1px dashed rgba(200,247,197,.45);border-radius:6px;touch-action:manipulation}
.platta.slag{background:rgba(200,247,197,.18)}
.punkter{display:flex;gap:8px;justify-content:center;margin-top:10px}
.punkter i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(200,247,197,.5)}
.punkter i.full{background:#c8f7c5}

/* 5 mönster */
.monster{position:relative;width:240px;height:240px;margin:0 auto;touch-action:none}
.monster svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.monster .prick{position:absolute;width:20px;height:20px;margin:-10px;border-radius:50%;border:1px solid rgba(200,247,197,.7)}
.monster .prick.pa{background:#c8f7c5;box-shadow:0 0 12px #9f9}

/* 6 hålkort */
.kort{background:#e9e1c8;color:#3a3324;text-shadow:none;padding:10px 8px;border-radius:3px;clip-path:polygon(14px 0,100% 0,100% 100%,0 100%,0 14px);font-size:11px}
.kortrad{display:grid;grid-template-columns:22px repeat(10,1fr);gap:3px;align-items:center;margin-top:4px}
.kortrad b{font-weight:400;opacity:.7}
.kortrad button{background:none;border:0;border-radius:0;color:#3a3324;text-shadow:none;font-size:11px;padding:4px 0;line-height:1}
.kortrad button.hal{background:#050505;color:#050505}
.matning{margin-top:10px;width:100%;padding:12px}
.kort.in{animation:matas 1s ease-in forwards}
@keyframes matas{to{transform:translateY(-140%)}}

/* 7 fingeravtryck */
.scanner{width:150px;height:190px;margin:4px auto 0;border:1px solid rgba(200,247,197,.5);border-radius:70px 70px 40px 40px;position:relative;overflow:hidden;display:grid;place-items:center;touch-action:none}
.scanner svg{width:96px;opacity:.45}
.scanner.pa svg{opacity:1}
.linje{position:absolute;left:0;right:0;height:2px;background:#9f9;box-shadow:0 0 14px #9f9;top:0;opacity:0}
.scanner.pa .linje{opacity:1;animation:skanna 1s linear infinite alternate}
@keyframes skanna{to{top:100%}}

/* 8 bildval */
.ar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ar button{padding:20px 0;font-size:18px}

/* 9 radio */
.radio{padding:6px 2px}
.radio input{width:100%;accent-color:#c8f7c5;height:34px}
.skala{display:flex;justify-content:space-between;font-size:11px;opacity:.55}
.frekvens{font-size:34px;color:#eaffea;text-align:center;margin:6px 0 2px}
.brus{font-size:13px;min-height:2.6em;word-break:break-all;text-align:center}
</style>
</head>
<body>
<main>
<h1>271126 // nio lås</h1>
<div class="intro">Prova varje lås. Rätt svar öppnar det, "börja om" återställer. Allt bygger på samma skämt: du fyller 25 men påstås vara född 1997.</div>
<div id="lista"></div>
</main>
<script>
const $ = (t, a, ...b) => { const e = document.createElement(t); for (const [k, v] of Object.entries(a || {})) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } e.append(...b); return e; };
const vibb = m => { try { navigator.vibrate && navigator.vibrate(m); } catch (e) {} };
const lista = document.getElementById('lista');

function las(nr, namn, besk, bygg) {
  const sek = $('section');
  const start = () => {
    const lcd = $('div', { class: 'lcd' }, $('i', { class: 'led' }), $('div', { class: 'text' }));
    const lada = $('div', { class: 'lada' }, lcd);
    const visa = (text, klass, stor) => { const t = lcd.querySelector('.text'); t.className = 'text ' + (klass || ''); t.replaceChildren(text, ...(stor ? [$('div', { class: 'stor' }, stor)] : [])); };
    const fel = text => { lada.classList.remove('skak'); void lada.offsetWidth; lada.classList.add('skak'); vibb([80, 50, 80]); visa(text, 'fel'); };
    const oppna = text => { lada.classList.add('ok'); vibb([30, 40, 90]); visa(text || 'RÄTT. dörren öppnas.', 'ratt'); };
    sek.replaceChildren($('h2', {}, `${nr}. ${namn}`), $('div', { class: 'besk' }, besk), lada, $('button', { class: 'om', onclick: start }, '↺ börja om'));
    bygg({ lada, visa, fel, oppna });
  };
  lista.append(sek); start();
}

// ------------------------------------------------ 1 porttelefon
las(1, 'Porttelefonen', 'Ring på hos rätt namn, som vid en riktig port.', ({ lada, visa, fel, oppna }) => {
  visa('pelikansgränd 5. ring på.');
  const namn = ['ÅKERLUND', 'BERGENUDD', 'CEDERHOLM', 'DAHLIN', 'EKSTRAND', 'FALK', 'GYLLENHAMMAR'];
  lada.append($('div', { class: 'namnlista' }, ...namn.map(n => $('button', { onclick: () => {
    visa('ringer ' + n.toLowerCase() + ' ...');
    setTimeout(() => n === 'BERGENUDD' ? oppna('"ja?" ... summer. dörren öppnas.') : fel('ingen svarar hos ' + n.toLowerCase() + '.'), 1300);
  } }, $('span', {}, n), $('i')))));
});

// ------------------------------------------------ 2 rotationslås
las(2, 'Rotationslåset', 'Snurra hjulet till 2, tryck i mitten. Snurra till 9, tryck igen.', ({ lada, visa, fel, oppna }) => {
  let vinkel = 0, kod = '', grepp = null, last = false;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', '-120 -120 240 240');
  let streck = '';
  for (let i = 0; i < 50; i++) {
    const a = i / 50 * Math.PI * 2, l = i % 5 === 0 ? 14 : 7;
    streck += `<line x1="${Math.sin(a) * 112}" y1="${-Math.cos(a) * 112}" x2="${Math.sin(a) * (112 - l)}" y2="${-Math.cos(a) * (112 - l)}"/>`;
  }
  let tal = '';
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; tal += `<text x="${Math.sin(a) * 84}" y="${-Math.cos(a) * 84 + 6}">${i}</text>`; }
  svg.innerHTML = `<g id="r"><circle r="118" fill="#0a0d0a" stroke="rgba(200,247,197,.5)"/><g stroke="#c8f7c5" stroke-width="1.5">${streck}</g><g fill="#eaffea" font-size="18" text-anchor="middle" font-family="Menlo,monospace">${tal}</g></g>`;
  const rot = svg.querySelector('#r');
  const aktuell = () => ((Math.round(-vinkel / 36) % 10) + 10) % 10;
  const mitt = $('div', { class: 'mitt' }, 'tryck');
  const visaKod = () => visa('snurra och tryck i mitten.', '', (kod + '_ _'.slice(kod.length * 2)).split('').join(''));
  const hjul = $('div', { class: 'hjul' }, svg, mitt);
  const vinkelAv = e => { const b = hjul.getBoundingClientRect(); return Math.atan2(e.clientX - b.left - b.width / 2, -(e.clientY - b.top - b.height / 2)) * 180 / Math.PI; };
  let senast = aktuell();
  hjul.addEventListener('pointerdown', e => { if (e.target === mitt) return; grepp = { a: vinkelAv(e), v: vinkel }; hjul.setPointerCapture(e.pointerId); });
  hjul.addEventListener('pointermove', e => {
    if (!grepp) return;
    vinkel = grepp.v + (vinkelAv(e) - grepp.a);
    rot.setAttribute('transform', `rotate(${vinkel})`);
    const n = aktuell(); if (n !== senast) { senast = n; vibb(6); }
    mitt.textContent = n;
  });
  hjul.addEventListener('pointerup', () => { grepp = null; });
  mitt.addEventListener('click', () => {
    if (last) return;
    kod += aktuell(); vibb(20);
    if (kod.length < 2) return visaKod();
    if (kod === '25') { kod = ''; return fel('FEL. gustav är född 1997?'); }
    if (kod !== '29') { kod = ''; return fel('FEL. försök igen.'); }
    last = true; oppna('RÄTT. 29. låset släpper.');
  });
  visaKod();
  mitt.textContent = '0';
  lada.append($('div', { class: 'ratt-ytan' }, $('div', { style: 'position:relative' }, $('div', { class: 'markor' }), hjul)));
});

// ------------------------------------------------ 3 morse
las(3, 'Morsekoden', 'Lampan blinkar en kod. Läs av den och slå in siffrorna.', ({ lada, visa, fel, oppna }) => {
  const MORSE = { 2: '..---', 9: '----.' };
  const lampa = $('div', { class: 'morselampa' });
  let kor = 0, v = '';
  const spela = async () => {
    const id = ++kor, P = ms => new Promise(r => setTimeout(r, ms));
    await P(500);
    while (id === kor) {
      for (const siffra of '29') {
        for (const tecken of MORSE[siffra]) {
          if (id !== kor) return;
          lampa.classList.add('pa'); await P(tecken === '.' ? 180 : 540);
          lampa.classList.remove('pa'); await P(180);
        }
        await P(700);
      }
      await P(1600);
    }
  };
  visa('kort = punkt, långt = streck. två siffror.', '', '_ _');
  const tryck = n => {
    v += n; visa('kort = punkt, långt = streck. två siffror.', '', (v + '_ _'.slice(v.length * 2)));
    if (v.length < 2) return;
    const s = v; v = '';
    if (s === '29') { kor++; return oppna('RÄTT. ..--- ----. betyder 29.'); }
    fel(s === '25' ? 'FEL. lyssna på lampan, inte på gustav.' : 'FEL. titta igen.');
  };
  lada.append($('div', { style: 'margin-bottom:12px' }, lampa),
    $('div', { class: 'knappar' }, ...'1234567890'.split('').map(n => $('button', { onclick: () => tryck(n) }, n))));
  spela();
  const stopp = new MutationObserver(() => { if (!lada.isConnected) { kor++; stopp.disconnect(); } });
  stopp.observe(lista, { childList: true, subtree: true });
});

// ------------------------------------------------ 4 rytm
las(4, 'Handskakningen', 'Plattan visar en rytm. Knacka samma rytm tillbaka.', ({ lada, visa, fel, oppna }) => {
  const MONSTER = [0, 300, 600, 1200, 1500];   // knack-knack-knack ... knack-knack
  const platta = $('div', { class: 'platta' }, 'titta först');
  const punkter = $('div', { class: 'punkter' }, ...MONSTER.map(() => $('i')));
  let tider = [], lyssnar = false;
  const blinka = () => { platta.classList.add('slag'); setTimeout(() => platta.classList.remove('slag'), 110); };
  const visaRytm = () => {
    lyssnar = false; platta.textContent = '...'; visa('så här knackar man på hos gustav:');
    MONSTER.forEach(t => setTimeout(blinka, 400 + t));
    setTimeout(() => { lyssnar = true; tider = []; platta.textContent = 'knacka här'; visa('din tur.'); punkter.querySelectorAll('i').forEach(i => i.className = ''); }, 400 + MONSTER.at(-1) + 600);
  };
  platta.addEventListener('pointerdown', () => {
    blinka(); vibb(15);
    if (!lyssnar) return;
    tider.push(performance.now());
    punkter.children[tider.length - 1].className = 'full';
    if (tider.length < MONSTER.length) return;
    lyssnar = false;
    const deras = tider.map(t => t - tider[0]), skala = deras.at(-1) / MONSTER.at(-1);
    const ok = deras.every((t, i) => Math.abs(t - MONSTER[i] * skala) < 170);
    if (ok) return oppna('RÄTT. du knackar som en stammis.');
    fel('FEL. det där var inte rytmen.'); setTimeout(visaRytm, 1400);
  });
  lada.append(platta, punkter);
  visaRytm();
});

// ------------------------------------------------ 5 mönster
las(5, 'Mönstret', 'Dra fingret mellan prickarna och rita siffran 2, som när man låser upp en telefon.', ({ lada, visa, fel, oppna }) => {
  const RATT = [0, 1, 2, 5, 4, 3, 6, 7, 8];   // en tvåa: överkant, ner höger, mitten, ner vänster, nederkant
  const yta = $('div', { class: 'monster' });
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', '0 0 240 240');
  const poly = document.createElementNS(ns, 'polyline'); poly.setAttribute('fill', 'none'); poly.setAttribute('stroke', '#c8f7c5'); poly.setAttribute('stroke-width', '3'); poly.setAttribute('stroke-linejoin', 'round');
  svg.append(poly); yta.append(svg);
  const pos = i => [30 + (i % 3) * 90, 30 + Math.floor(i / 3) * 90];
  const prickar = [...Array(9)].map((_, i) => { const p = $('div', { class: 'prick' }); const [x, y] = pos(i); p.style.left = x + 'px'; p.style.top = y + 'px'; yta.append(p); return p; });
  let vag = [], ritar = false, klar = false;
  const rita = () => { poly.setAttribute('points', vag.map(i => pos(i).join(',')).join(' ')); prickar.forEach((p, i) => p.classList.toggle('pa', vag.includes(i))); };
  const traff = e => { const b = yta.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top; return prickar.findIndex((_, i) => { const [px, py] = pos(i); return Math.hypot(px - x, py - y) < 28; }); };
  yta.addEventListener('pointerdown', e => { if (klar) return; ritar = true; vag = []; yta.setPointerCapture(e.pointerId); const t = traff(e); if (t >= 0) { vag.push(t); vibb(8); } rita(); });
  yta.addEventListener('pointermove', e => { if (!ritar) return; const t = traff(e); if (t >= 0 && !vag.includes(t)) { vag.push(t); vibb(8); rita(); } });
  yta.addEventListener('pointerup', () => {
    if (!ritar) return; ritar = false;
    if (vag.join() === RATT.join()) { klar = true; return oppna('RÄTT. det där är en tvåa. och en nia är nästa gång.'); }
    fel('FEL. rita en tvåa.'); setTimeout(() => { vag = []; rita(); }, 600);
  });
  visa('rita en tvåa.');
  lada.append(yta);
});

// ------------------------------------------------ 6 hålkort
las(6, 'Hålkortet', 'Stansa hål i rätt siffror, en per rad, och mata in kortet.', ({ lada, visa, fel, oppna }) => {
  const val = ['', ''];
  const rader = [0, 1].map(r => $('div', { class: 'kortrad' }, $('b', {}, r === 0 ? 'tio' : 'ett'),
    ...'0123456789'.split('').map(n => $('button', { onclick: e => {
      val[r] = n; vibb(12);
      [...e.target.parentElement.querySelectorAll('button')].forEach(b => b.classList.toggle('hal', b === e.target));
    } }, n))));
  const kort = $('div', { class: 'kort' }, $('div', {}, '271126 · INPASSERING · ÅLDER'), ...rader);
  visa('stansa gustavs ålder och mata in kortet.');
  lada.append(kort, $('button', { class: 'matning', onclick: () => {
    const s = val.join('');
    if (s.length < 2) return fel('stansa en siffra på varje rad.');
    kort.classList.add('in');
    setTimeout(() => {
      if (s === '29') return oppna('RÄTT. kortet godkänt.');
      kort.classList.remove('in');
      fel(s === '25' ? 'FEL. gustav är född 1997?' : 'FEL. kortet spottas ut.');
    }, 1000);
  } }, 'MATA IN KORTET'));
});

// ------------------------------------------------ 7 fingeravtryck
las(7, 'Fingeravtrycket', 'Håll tummen på läsaren tills den har läst färdigt.', ({ lada, visa, fel, oppna }) => {
  const scanner = $('div', { class: 'scanner' }, $('div', { class: 'linje' }));
  scanner.insertAdjacentHTML('afterbegin', '<svg viewBox="0 0 60 80" fill="none" stroke="#c8f7c5" stroke-width="1.6"><path d="M30 6c-14 0-24 11-24 25v10"/><path d="M54 31c0-14-10-25-24-25"/><path d="M14 46V31c0-9 7-16 16-16s16 7 16 16v18"/><path d="M22 66V31c0-5 3-8 8-8s8 3 8 8v26"/><path d="M30 31v40"/><path d="M46 57v8M14 54v8M6 46v6M54 41v12"/></svg>');
  let t = null, klar = false, start = 0;
  visa('lägg tummen på läsaren.');
  const slapp = () => { if (klar) return; clearInterval(t); scanner.classList.remove('pa'); if (start && performance.now() - start < 2000) fel('för kort. håll kvar.'); start = 0; };
  scanner.addEventListener('pointerdown', e => {
    if (klar) return; e.preventDefault(); start = performance.now(); scanner.classList.add('pa');
    t = setInterval(() => {
      const p = Math.min(100, Math.round((performance.now() - start) / 20));
      visa('läser ... ' + p + '%');
      if (p >= 100) { clearInterval(t); klar = true; scanner.classList.remove('pa'); oppna('identitet bekräftad. välkommen.'); }
    }, 60);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(h => scanner.addEventListener(h, slapp));
  scanner.addEventListener('contextmenu', e => e.preventDefault());
  lada.append(scanner);
});

// ------------------------------------------------ 8 bildval
las(8, 'Årtalet', 'Välj vilket år gustav är född.', ({ lada, visa, fel, oppna }) => {
  let lurad = false, klar = false;
  visa('vilket år är gustav född?');
  lada.append($('div', { class: 'ar' }, ...['1995', '1996', '1997', '1999', '2000', '2001', '2002', '2003', '2004'].map(a => $('button', { onclick: () => {
    if (klar) return;
    if (a === '2001' && !lurad) { lurad = true; return fel('FEL. gustav är född 1997?'); }
    if (a === '1997' || (a === '2001' && lurad)) { klar = true; return oppna(a === '1997' ? 'RÄTT. 1997. han fyller 29.' : 'RÄTT. du står på dig. han fyller 25.'); }
    fel('FEL. inte i närheten.');
  } }, a))));
});

// ------------------------------------------------ 9 radio
las(9, 'Radion', 'Vrid fram rätt frekvens tills bruset försvinner. Ledtråd: datumet.', ({ lada, visa, fel, oppna }) => {
  const MAL = 27.11;
  let ljud = null, brusGain = null, klar = false;
  const startaLjud = () => {
    if (ljud) return;
    try {
      ljud = new (window.AudioContext || window.webkitAudioContext)();
      const buf = ljud.createBuffer(1, ljud.sampleRate * 2, ljud.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const kalla = ljud.createBufferSource(); kalla.buffer = buf; kalla.loop = true;
      brusGain = ljud.createGain(); brusGain.gain.value = .12;
      kalla.connect(brusGain).connect(ljud.destination); kalla.start();
    } catch (e) {}
  };
  const frek = $('div', { class: 'frekvens' }, '26.00 MHz');
  const brus = $('div', { class: 'brus' });
  const reglage = $('input', { type: 'range', min: '26', max: '28', step: '0.01', value: '26' });
  const TECKEN = '#%&@$*+=-/\\|;:~^';
  const uppdatera = () => {
    const f = Number(reglage.value), avst = Math.abs(f - MAL);
    frek.textContent = f.toFixed(2) + ' MHz';
    const styrka = Math.min(1, avst / .6);
    if (brusGain) brusGain.gain.value = .02 + .14 * styrka;
    const ord = 'VÄLKOMMEN IN';
    brus.textContent = ord.split('').map(c => Math.random() < styrka ? TECKEN[Math.floor(Math.random() * TECKEN.length)] : c).join('');
    if (avst < .015 && !klar) {
      klar = true; if (brusGain) brusGain.gain.value = 0;
      oppna('signal låst på 27.11. välkommen in.');
    }
  };
  reglage.addEventListener('pointerdown', startaLjud);
  reglage.addEventListener('input', uppdatera);
  const flimmer = setInterval(() => { if (!lada.isConnected) { clearInterval(flimmer); try { ljud && ljud.close(); } catch (e) {} return; } if (!klar) uppdatera(); }, 120);
  visa('ställ in frekvensen.');
  lada.append($('div', { class: 'radio' }, frek, brus, reglage, $('div', { class: 'skala' }, $('span', {}, '26.00'), $('span', {}, '27.00'), $('span', {}, '28.00'))));
  uppdatera();
});
</script>
</body>
