// ---------------------------------------------------------------- terminalen skriver
const vila = ms => new Promise(r => setTimeout(r, snabbt ? 0 : ms));
document.addEventListener('pointerdown', e => { if (!e.target.closest('button,a')) snabbt = true; });
let ankare = null;   // när ett nytt steg börjar hålls det steget överst i stället för att sidan följer botten
const botten = () => ankare ? ankare.scrollIntoView({ block: 'start' }) : window.scrollTo(0, document.body.scrollHeight);
async function skriv(text, klass) {
  const r = el('div', { class: 'l ' + (klass || '') });
  m.append(r);
  for (const c of text) { r.append(c); if (!snabbt) { botten(); await vila(26); } }
  botten();
  await vila(320);
  return r;
}
const tom = () => m.append(el('div', { class: 'l' }, ' '));
const rad = (text, klass) => el('div', { class: 'l ' + (klass || '') }, text);

function skaka() {
  document.body.classList.remove('skak'); void document.body.offsetWidth; document.body.classList.add('skak');
  setTimeout(() => document.body.classList.remove('skak'), 600);
  if (navigator.vibrate) navigator.vibrate([70, 40, 70, 40, 160]);
}

function nedrakning() {
  const ms = new Date(FEST.start) - Date.now();
  if (ms <= 0) return t().nu;
  const s = Math.floor(ms / 1000), tv = n => String(n).padStart(2, '0');
  return `${t().kvar} ${Math.floor(s / 86400)}d ${tv(Math.floor(s / 3600) % 24)}:${tv(Math.floor(s / 60) % 60)}:${tv(s % 60)}`;
}

function karta(bygg) {
  const k = el('div', { class: 'karta' + (bygg ? ' bygger' : '') });
  k.innerHTML = KARTA;   // fast teckning ur karta.js, inget som kommer utifrån
  const status = el('div', { class: 'l kstatus' }, bygg ? '' : '\u00a0');
  const adr = encodeURIComponent(FEST.adress + ', ' + FEST.plats);
  // iPhone och Mac öppnar Apple Kartor, övriga Google Maps
  const kartlank = /iPhone|iPad|Macintosh/.test(navigator.userAgent) ? 'https://maps.apple.com/?q=' + adr : 'https://www.google.com/maps/search/?api=1&query=' + adr;
  k.append(status, el('a', { href: kartlank, target: '_blank', rel: 'noopener' }, t().kartor),
           el('span', { class: 'svag' }, ' © OpenStreetMap'));
  if (bygg) requestAnimationFrame(() => byggKarta(k, status));
  return k;
}

// Kartan ritas fram som i en spionfilm: kustlinjen, gatorna en i taget, namnen, och till sist siktet på adressen.
async function byggKarta(k, status) {
  const sv = k.querySelector('svg'), paus = ms => new Promise(r => setTimeout(r, ms));
  const rita = (p, ms) => {
    const L = p.getTotalLength();
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.style.opacity = 1;
    p.getBoundingClientRect();
    p.style.transition = `stroke-dashoffset ${ms}ms linear`;
    p.style.strokeDashoffset = 0;
  };
  const kust = sv.querySelector('.kust'), gator = sv.querySelector('.gator'), mal = sv.querySelector('.mal');
  const namn = [...sv.querySelectorAll('.namn text')], har = sv.querySelector('.har');
  namn.forEach(n => { n.style.opacity = 0; }); har.style.opacity = 0;
  const skrivStatus = async text => { status.textContent = ''; for (const c of text) { status.textContent += c; await paus(14); } };
  const [lat, lon] = [59.3239719, 18.0741567];
  await paus(500);
  await skrivStatus(t().kartLaddar);
  await paus(300);
  k.classList.add('ram');
  await paus(400);
  rita(kust, 1100); await paus(800);
  status.dataset.steg = 'gator';
  rita(gator, 4000);
  const start = Date.now();
  while (Date.now() - start < 4000) {
    const p = (Date.now() - start) / 4000;
    status.textContent = `> ${t().kartSoker} ${(lat + (1 - p) * (Math.random() - .5) * .02).toFixed(4)} N ${(lon + (1 - p) * (Math.random() - .5) * .04).toFixed(4)} E`;
    await paus(60);
  }
  for (const n of namn) { n.style.opacity = 1; await paus(140); }
  rita(mal, 500); await paus(500);
  har.style.opacity = 1; har.querySelectorAll('path').forEach(p => { p.style.opacity = 1; }); har.classList.add('sikte');
  if (navigator.vibrate) navigator.vibrate(30);
  status.textContent = `> ${t().kartLast}: ${lat.toFixed(4)} N ${lon.toFixed(4)} E`;
  status.classList.add('stark');
}

function valjSprak() {
  return new Promise(klar => {
    const r = el('div', { class: 'l val' }, '> språk / language / idioma / langue: ',

        sprak = s; try { localStorage.setItem('sprak', s); } catch (e) {}
        document.documentElement.lang = s;
        r.replaceChildren('> språk / language / idioma / langue: ' + s); klar();
      } }, `[${s}]`)));
    m.append(r); botten();
  });
}

async function inbjudan() {
  await skriv(`> ${t().identitet}: ${lank.namn.toUpperCase()}`, 'stark');
  if (lank.platser > 1) await skriv(`> ${t().sallskap}: ${t().plus(lank.platser)}${lank.villkor ? ' (' + lank.villkor + ')' : ''}`);
  tom();
  await skriv('> ' + t().lana);
  tom();
  await skriv('> ' + t().sakerhet);
  await skriv('> ' + t().fraga, 'stark');
  return fragan();
}

function fragan() {
  return new Promise(klar => {
    let v = '', last = false, lurad = false;
    const visning = rad('', 'kod'), fel = rad(' ', 'fel'), ledtrad = rad('', 'stark');
    const rita = () => { visning.textContent = `  ${t().svar}: ${v.padEnd(2, '_').split('').join(' ')}`; };
    const tryck = n => {
      if (last) return;
      if (n === '<') { v = v.slice(0, -1); return rita(); }
      if (v.length >= 2) return;
      v += n; rita(); fel.textContent = ' ';
      if (navigator.vibrate) navigator.vibrate(10);
      if (v.length < 2) return;
      const svar = Number(v); v = '';
      if (!lurad && svar === ALDER) {
        lurad = true; skaka();
        fel.textContent = '\u00a0'; ledtrad.textContent = '> ' + t().lur;
        return setTimeout(() => { rita(); botten(); }, 600);
      }
      // 29 går alltid igenom, även direkt, så den som kommer tillbaka slipper hela leken
      if (svar !== LOGN) {
        fel.textContent = '> ' + (lurad ? t().skriv29 : svar < LOGN ? t().aldre : t().yngre);
        return setTimeout(rita, 450);
      }
      last = true; document.removeEventListener('keydown', tangent);
      knappar.remove(); fel.remove();
      klar();
    };
    const tangent = e => { if (/^[0-9]$/.test(e.key)) tryck(e.key); else if (e.key === 'Backspace') tryck('<'); };
    document.addEventListener('keydown', tangent);
    const knappar = el('div', { class: 'tang' },
      ...'123456789'.split('').map(n => el('button', { onclick: () => tryck(n) }, `[${n}]`)),
      el('span'), el('button', { onclick: () => tryck('0') }, '[0]'), el('button', { onclick: () => tryck('<') }, '[<]'));
    rita();
    m.append(visning, knappar, fel, ledtrad); botten();
  });
}

function gastFormular(ombord) {
  return new Promise(klar => {
    const n = lank.platser - 1, finns = lank.gaster || [];
    const falt = Array.from({ length: n }, (_, i) => el('input', { class: 'gastfalt', placeholder: t().gast(i + 1), maxlength: '60', autocomplete: 'off', autocapitalize: 'words' }));
    falt.forEach((f, i) => { f.value = finns[i] || ''; });
    const fel = rad('', 'fel tips');
    const spara = el('button', { onclick: async () => {
      spara.disabled = true; fel.textContent = t().sparar;
      try {
        const s = await skicka({ a: 'gaster', k: kod, gaster: falt.map(f => f.value) });
        if (!s.ok) throw new Error(s.fel);
        lank.gaster = s.gaster; ruta.remove(); klar();
      } catch (e) { fel.textContent = '> ' + t().kontakt; spara.disabled = false; }
    } }, t().sparaNamn);
    const ruta = el('div', { class: 'gastruta' }, rad('> ' + t().vem(lank.platser), 'stark'),
      ...(lank.villkor ? [rad(`  ${t().villkorRad}: ${lank.villkor}`, 'stark')] : []), rad('  ' + t().valfritt, 'svag'), ...falt,
      el('div', { class: 'rutor' }, spara, el('button', { onclick: () => { ruta.remove(); klar(); } }, t().hoppa)), fel);
    (ombord || m).append(ruta);
    if (!ombord) botten();
  });
}

async function laddaPasserkort() {
  snabbt = false;
  const svar = skicka({ a: 'svar', k: kod, svar: 'ja' });
  await vila(500);
  ankare = null; m.style.paddingBottom = '';
  m.className = 'mitten';
  const stapel = rad('');
  m.replaceChildren(rad('271126', 'svag'), rad(`> ${t().laddar}`), stapel);
  window.scrollTo(0, 0);
  for (let i = 0; i <= 20; i++) {
    stapel.textContent = `  [${'#'.repeat(i)}${'.'.repeat(20 - i)}] ${String(i * 5).padStart(3)}%`;
    await vila(i < 17 ? 55 : 160);
  }
  const s = await svar;
  if (!s.ok) throw new Error(s.fel);
  lank = Object.assign(s, { gaster: lank.gaster });
  await vila(250);
  m.className = '';
  location.hash = 'kort';
}

async function svaraInte(v) {
  const s = await skicka({ a: 'svar', k: kod, svar: v });
  if (!s.ok) throw new Error(s.fel);
  lank = s;
  tom();
  await skriv('> ' + t().nejSvar, 'stark');
}

async function sparaBild(tips) {
  const B = 1080, H = 1720, c = document.createElement('canvas');
  c.width = B; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#050505'; g.fillRect(0, 0, B, H);
  g.fillStyle = '#c8f7c5'; g.font = '40px Menlo, monospace';
  g.fillText(`271126 // ${t().passerkort}`, 70, 110);
  const q = qrcode(0, 'M'); q.addData(location.origin + '/v.html?b=' + kod); q.make();
  const antal = q.getModuleCount(), ruta = Math.floor(860 / (antal + 6)), sida = ruta * (antal + 6), x0 = (B - sida) / 2, y0 = 160;
  g.fillStyle = '#fff'; g.fillRect(x0, y0, sida, sida);
  g.fillStyle = '#000';
  for (let y = 0; y < antal; y++) for (let x = 0; x < antal; x++) if (q.isDark(y, x)) g.fillRect(x0 + (x + 3) * ruta, y0 + (y + 3) * ruta, ruta, ruta);
  let y = y0 + sida + 110;
  sparaBildText().forEach((r, i) => {
    g.fillStyle = i === 0 ? '#eaffea' : '#c8f7c5'; g.font = (i === 0 ? '76px' : '38px') + ' Menlo, monospace';
    g.fillText(r, 70, y); y += i === 0 ? 86 : 54;
  });
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const fil = new File([blob], '271126-passerkort.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [fil] })) {
    tips.textContent = '  ' + t().bildtips;
    try { await navigator.share({ files: [fil] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  // Utan dela-menyn: visa bilden i helskärm. Ett långt tryck på bilden ger "Lägg till i Bilder" på iPhone.
  const vy = el('div', { class: 'bildvy', onclick: e => { if (e.target === vy || e.target.tagName === 'BUTTON') vy.remove(); } },
    rad('> ' + t().hallInne, 'stark'), el('img', { src: URL.createObjectURL(blob), alt: '271126' }), el('button', {}, '[ ' + t().stang + ' ]'));
  document.body.append(vy);
}

const lankAdress = () => location.origin + location.pathname + location.search;
// iPhone, iPad och Mac öppnar kalenderfilen i sin egen kalender. Övriga (Android) får Google Kalender.
const kalender = () => /iPhone|iPad|Macintosh/.test(navigator.userAgent) ? (location.href = '271126.ics') : googleKalender();
const googleKalender = () => window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text=271126&dates=20261127T210000Z/20261128T030000Z'
  + '&location=' + encodeURIComponent(FEST.adress + ', ' + FEST.plats) + '&details=' + encodeURIComponent(lankAdress()), '_blank', 'noopener');

const topp = (titel, knapp) => el('div', { class: 'l topp' }, el('span', {}, `271126 // ${titel}`), knapp);
const nastaSprak = () => SPRAK[(SPRAK.indexOf(sprak) + 1) % SPRAK.length];
const sprakknapp = rita => el('button', { onclick: () => { sprak = nastaSprak(); try { localStorage.setItem('sprak', sprak); } catch (e) {} rita(); } }, `[${nastaSprak()}]`);

function visaKort() {
  clearInterval(klocka);
  const n = lank.platser, tips = el('div', { class: 'l svag tips' });
  const saknas = n > 1 && (lank.gaster || []).length < n - 1;
  m.className = '';
  m.replaceChildren(
    topp(t().passerkort, sprakknapp(visaKort)),
    el('div', { class: 'qr' }, qrBild(location.origin + '/v.html?b=' + kod)),
    rad(t().pers(n), 'stor'),
    rad('\u00a0'),
    rad(t().gastlista + (lank.villkor && n > 1 ? `  (plus: ${lank.villkor})` : ''), 'rubrik'),
    el('div', { class: 'lista' }, ...Array.from({ length: n }, (_, i) => {
      const namn = i === 0 ? lank.namn : (lank.gaster || [])[i - 1];
      return el('div', { class: 'post' + (namn ? '' : ' tom') }, el('span', { class: 'pnr' }, String(i + 1)), el('span', {}, namn ? namn.toUpperCase() : t().namnSaknas));
    })),
    ...(n > 1 ? [rad('\u00a0'), rad('> ' + t().enKod), rad('> ' + t().olikaTider, 'svag')] : []),
    ...(n > 1 ? [el('div', { class: 'rutor gastknapp' + (saknas ? ' saknas' : '') },
            el('button', { onclick: async e => { const plats = e.target.parentElement; plats.className = 'gastknapp'; plats.replaceChildren(); await gastFormular(plats); visaKort(); } }, t().laggTill))] : []),
    rad(' '),
    rad('> ' + t().spara),
    el('div', { class: 'rutor' },
      el('button', { onclick: () => sparaBild(tips) }, t().bild),
      el('button', { onclick: kalender }, t().kal)),
    tips,
    el('button', { class: 'stor-knapp gron', onclick: () => { location.hash = 'info'; } }, `[ ${t().infoknapp} ]`));
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- sida 3: info
function visaInfo() {
  clearInterval(klocka);
  const ned = rad('> ' + nedrakning(), 'stark');
  klocka = setInterval(() => { ned.textContent = '> ' + nedrakning(); }, 1000);
  m.className = '';
  m.replaceChildren(
    topp(t().info, sprakknapp(visaInfo)),
    ned,
    rad(' '),
    rad(`> ${t().program}`, 'stark'),
    rad('  ' + t().dag),
    ...FEST.program.map(([tid, vad]) => rad(`  ${tid}  ${akt(vad)}`)),
    rad(' '),
    rad(`> ${t().plats}`, 'stark'),
    rad(`  ${FEST.adress.toUpperCase()}, ${FEST.plats.toUpperCase()}`),
    karta(true),
    rad('> ' + t().kladsel),
    el('button', { class: 'stor-knapp', onclick: () => { location.hash = 'kort'; } }, `[ ${t().tillbaka} ]`));
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- start och navigering
function visaSida() {
  if (!lank || lank.svar !== 'ja') return;
  if (location.hash === '#info') visaInfo(); else visaKort();
}
window.addEventListener('hashchange', visaSida);

async function start() {
  await skriv('271126');
  if (!kod) return skriv('> ' + T.sv.ingen + ' / ' + T.en.ingen, 'svag');
  if (!API) return skriv('> ' + T.sv.stangt, 'svag');
  const hamtat = hamta({ a: 'l', k: kod }).catch(() => null);
  if (!sprak) await valjSprak();
  const anslut = await skriv('> ' + t().ansluter);
  lank = await hamtat;
  if (!lank) return skriv('> ' + t().kontakt, 'fel');
  if (!lank.ok) return skriv('> ' + t().ingen, 'svag');
  anslut.append(' ' + t().ok);
  await vila(300);
  if (lank.svar === 'ja') { await vila(250); location.hash = 'kort'; return visaSida(); }
  if (lank.svar) await skriv('> ' + t().tidigare(t()[lank.svar] || lank.svar), 'svag');
  await inbjudan();
  await skriv('> ' + t().godkand, 'stark');
  await vila(700);
  // nytt steg: luft, en avdelare och frågan stort; sidan glider vidare nedåt
  const steg = el('div', { class: 'nytt-steg' });
  m.append(steg);
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  await vila(700);
  await skriv('> ' + t().sista, 'svag');
  for (;;) {
    await skriv(t().kommer, 'stor-fraga');
    const v = await kommerDu();
    try {
      if (v === 'ja' && lank.platser > 1) await gastFormular();
      if (v === 'ja') await laddaPasserkort(); else await svaraInte(v);
      break;
    }
    catch (e) { m.className = ''; await skriv('> ' + t().kontakt, 'fel'); }
  }
}
if (location.hash) history.replaceState(null, '', location.pathname + location.search);
start();
</script>
