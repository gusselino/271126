<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>271126</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>
<main id="m"></main>
<div id="blixt"></div>
<script src="qrcode.js"></script>
<script src="app.js"></script>
<script>
const m = document.getElementById('m');
const kod = (location.search.slice(1).split('&')[0] || location.hash.slice(1)).toLowerCase().replace(/[^a-z0-9]/g, '');
let lank = null, klocka = null;

// ---- nedräkning i stället för sidhuvud: siffrorna tickar ner mot 22.00 den 27 november
function nedrakning() {
  const ms = new Date(FEST.start) - Date.now();
  if (ms <= 0) return 'Nu.';
  const s = Math.floor(ms / 1000), tv = n => String(n).padStart(2, '0');
  return `${Math.floor(s / 86400)} d ${tv(Math.floor(s / 3600) % 24)} h ${tv(Math.floor(s / 60) % 60)} m ${tv(s % 60)} s`;
}

function rad(v, h) { return el('div', { class: 'rad' }, el('span', {}, v), h ? el('b', {}, h) : ''); }

function visa(delar, snabbt) {
  clearInterval(klocka);
  const ned = el('b', {}, nedrakning());
  klocka = setInterval(() => { ned.textContent = nedrakning(); }, 1000);
  const allt = [
    el('div', { class: 'nr' + (snabbt ? '' : ' flimmer') }, '271126'),
    el('div', { class: 'block' }, rad(FEST.datum), el('div', { class: 'rad' }, ned)),
    ...delar,
  ];
  allt.forEach((d, i) => d.style.setProperty('--i', i));
  m.style.setProperty('--steg', snabbt ? '40ms' : '260ms');
  m.className = 'in';
  m.replaceChildren(...allt);
}

function stangt(text) { visa([el('div', { class: 'fyll' }), el('div', { class: 'svag' }, text)], true); }

const ANTAL = ['', 'en', 'två', 'tre', 'fyra', 'fem', 'sex'];
const fornamn = n => n.trim().split(/\s+/)[0];

function program() {
  return el('div', { class: 'block' }, ...FEST.program.map(([t, v]) => rad(v, t)), rad(FEST.plats), rad(FEST.adress));
}

// ---- steg 1: inbjudan. Man tackar ja genom att hålla knappen intryckt.
function visaInbjudan() {
  const extra = lank.platser - 1;
  const hall = el('button', { class: 'hall', type: 'button' }, el('i'), el('span', {}, 'Håll inne för att tacka ja'));
  const fel = el('div', { class: 'fel' });
  let t = null, klar = false;
  const borja = e => {
    if (klar) return;
    e.preventDefault();
    hall.classList.add('pa');
    t = setTimeout(async () => {
      klar = true;
      if (navigator.vibrate) navigator.vibrate([30, 40, 90]);
      document.getElementById('blixt').classList.add('pa');
      try {
        const s = await skicka({ a: 'ja', k: kod });
        if (!s.ok) throw new Error(s.fel);
        lank = s;
        visaBiljett(false);
      } catch (err) {
        klar = false; hall.classList.remove('pa');
        fel.textContent = 'Ingen kontakt. Försök igen.';
      }
    }, 1100);
  };
  const slapp = () => { if (!klar) { clearTimeout(t); hall.classList.remove('pa'); } };
  hall.addEventListener('pointerdown', borja);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(h => hall.addEventListener(h, slapp));
  hall.addEventListener('contextmenu', e => e.preventDefault());
  hall.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') borja(e); });
  hall.addEventListener('keyup', slapp);

  visa([
    el('div', { class: 'block' },
      el('div', { class: 'stor' }, fornamn(lank.namn) + '.'),
      el('div', { class: 'mellan' }, 'Du är bjuden.'),
      extra > 0 ? el('div', { class: 'mellan' }, `Du får ta med ${ANTAL[extra] || extra} ${extra === 1 ? 'person' : 'personer'}.`) : ''),
    program(),
    el('div', { class: 'block' }, hall, fel),
  ], false);
}

// ---- steg 2: biljetten
function visaBiljett(snabbt) {
  const extra = lank.platser - 1;
  const galler = extra === 0
    ? [el('div', { class: 'mellan' }, 'Gäller bara dig.')]
    : [el('div', { class: 'mellan' }, `Gäller dig och ${ANTAL[extra] || extra} till.`),
       el('div', { class: 'block' },
         rad('Ni visar samma kod i dörren.'),
         rad('Kommer ni inte samtidigt? Skicka en skärmbild av koden till dem.'),
         rad('Vakten släpper in högst ' + (ANTAL[lank.platser] || lank.platser) + ' på den.'))];
  visa([
    el('div', { class: 'qr' }, qrBild(location.origin + '/v.html?b=' + kod)),
    el('div', { class: 'block' },
      el('div', { class: 'stor' }, lank.platser === 1 ? '1 person' : lank.platser + ' personer'),
      el('div', { class: 'svag' }, lank.namn),
      ...galler),
    program(),
    el('div', { class: 'block' }, rad(FEST.kladsel)),
  ], snabbt);
  window.scrollTo(0, 0);
}

async function ladda() {
  if (!kod) return stangt('Ingen inbjudan.');
  if (!API) return stangt('Stängt.');
  try { lank = await hamta({ a: 'l', k: kod }); } catch (e) { return stangt('Ingen kontakt. Ladda om sidan.'); }
  if (!lank.ok) return stangt('Ingen inbjudan.');
  if (lank.ja) visaBiljett(true); else visaInbjudan();
}

ladda();
</script>
</body>
</html>
