<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050505">
<title>271126</title>
<link rel="stylesheet" href="stil.css">
</head>
<body class="term">
<main id="m"></main>
<script src="qrcode.js"></script>
<script src="app.js"></script>
<script src="karta.js"></script>
<script>
const m = document.getElementById('m');
const kod = (location.search.slice(1).split('&')[0]).toLowerCase().replace(/[^a-z0-9]/g, '');
const ALDER = 25, LOGN = 29;   // det sanna svaret och det som ledtråden lurar fram (född 1997)
let lank = null, sprak = null, snabbt = false, klocka = null;
try { sprak = localStorage.getItem('sprak'); } catch (e) {}

const ANTAL_SV = ['', 'en', 'två', 'tre', 'fyra', 'fem'], ANTAL_EN = ['', 'one', 'two', 'three', 'four', 'five'];
const T = {
  sv: {
    ansluter: 'ansluter till 271126 ...', ok: 'ok',
    ingen: 'ingen inbjudan hittades.', stangt: 'stängt.', kontakt: 'ingen kontakt. ladda om sidan.',
    identitet: 'identitet', sallskap: 'sällskap',
    plus: n => `+ ${n - 1} ${n === 2 ? 'person' : 'personer'}`,
    lana: 'gustav bergenudd vill låna ditt sällskap några timmar fredagen den 27 november.',
    sakerhet: 'lite säkerhetsåtgärder, så att vi vet att det faktiskt är du som kommer.',
    hamta: 'svara på frågan nedan för att hämta ditt passerkort.',
    fraga: 'säkerhetsfråga: vad fyller gustav?', svar: 'svar',
    aldre: 'FEL. han blir äldre.', yngre: 'FEL. han blir yngre.', fel: 'FEL.',
    lur: 'ledtråd: gustav är faktiskt född 1997 och har i alla år ljugit om sin ålder. han fyller med andra ord 29. skriv 29 för att få din biljett.',
    skriv29: 'FEL. skriv 29.', godkand: 'GODKÄND.', laddar: 'laddar passerkort',
    kommer: 'en sista fråga. kommer du fredag 27 november?', ja: 'JA, JAG KOMMER', kanske: 'KANSKE', nej: 'NEJ, JAG KAN INTE',
    kanskeSvar: 'noterat: kanske. ingen biljett än. öppna samma länk igen när du vet, så får du svara på nytt.',
    nejSvar: 'noterat: nej. synd, du kommer att saknas. ändrar du dig går det bra att öppna länken igen.',
    tidigare: s => `ditt senaste svar: ${s}. du får svara igen.`,
    passerkort: 'PASSERKORT', info: 'INFO',
    pers: n => n === 1 ? 'BARA DU' : `DU + ${n - 1}`,
    galler: n => n === 1 ? 'biljetten gäller 1 person.' : `biljetten gäller ${n} personer: dig och ${ANTAL_SV[n - 1] || n - 1} till.`,
    samma: 'ni visar samma kod i dörren.', skarm: 'kommer ni inte samtidigt? skicka en skärmbild av koden.',
    spara: 'spara biljetten på något av följande sätt:', bild: 'SPARA SOM BILD', bildtips: 'välj ”spara bild” så hamnar den i bilder.',
    kal: 'LÄGG IN I KALENDERN', mejlknapp: 'MEJLA TILL DIG SJÄLV',
    infoknapp: 'INFO: PROGRAM, KARTA', tillbaka: 'TILLBAKA TILL PASSERKORTET',
    dag: 'fredag 27 november 2026', dorr: 'dörrarna öppnar', program: 'program', plats: 'plats',
    kartor: '[öppna i kartor]', kladsel: 'kom som dig själv.', kvar: 'startar om', nu: 'det är nu.',
    amne: '271126 – mitt passerkort', mejltext: 'Mitt passerkort till fredag 27 november:',
  },
  en: {
    ansluter: 'connecting to 271126 ...', ok: 'ok',
    ingen: 'no invitation found.', stangt: 'closed.', kontakt: 'no connection. reload the page.',
    identitet: 'identity', sallskap: 'guests',
    plus: n => `+ ${n - 1} ${n === 2 ? 'person' : 'people'}`,
    lana: 'gustav bergenudd would like to borrow your company for a few hours on friday 27 november.',
    sakerhet: 'a few security measures, so we know it is actually you coming.',
    hamta: 'answer the question below to get your pass.',
    fraga: 'security question: how old is gustav turning?', svar: 'answer',
    aldre: 'WRONG. he is older.', yngre: 'WRONG. he is younger.', fel: 'WRONG.',
    lur: 'hint: gustav was actually born in 1997 and has lied about his age for years. in other words he is turning 29. enter 29 to get your ticket.',
    skriv29: 'WRONG. enter 29.', godkand: 'ACCEPTED.', laddar: 'loading pass',
    kommer: 'one last question. are you coming on friday 27 november?', ja: 'YES, I AM COMING', kanske: 'MAYBE', nej: 'NO, I CAN NOT',
    kanskeSvar: 'noted: maybe. no ticket yet. open the same link again when you know, and answer again.',
    nejSvar: 'noted: no. too bad, you will be missed. if you change your mind, just open the link again.',
    tidigare: s => `your last answer: ${s}. you can answer again.`,
    passerkort: 'PASS', info: 'INFO',
    pers: n => n === 1 ? 'JUST YOU' : `YOU + ${n - 1}`,
    galler: n => n === 1 ? 'the ticket is valid for 1 person.' : `the ticket is valid for ${n} people: you and ${ANTAL_EN[n - 1] || n - 1} more.`,
    samma: 'you all show the same code at the door.', skarm: 'not arriving together? send them a screenshot of the code.',
    spara: 'save your ticket in one of these ways:', bild: 'SAVE AS IMAGE', bildtips: 'choose “save image” to put it in photos.',
    kal: 'ADD TO CALENDAR', mejlknapp: 'EMAIL IT TO YOURSELF',
    infoknapp: 'INFO: LINE-UP, MAP', tillbaka: 'BACK TO YOUR PASS',
    dag: 'friday 27 november 2026', dorr: 'doors open', program: 'line-up', plats: 'location',
    kartor: '[open in maps]', kladsel: 'come as yourself.', kvar: 'starts in', nu: 'it is now.',
    amne: '271126 – my pass', mejltext: 'My pass for Friday 27 November:',
  },
};
const t = () => T[sprak || 'sv'];
const akt = vad => vad === 'Dörrarna öppnar' ? t().dorr : vad.toUpperCase();

// ---------------------------------------------------------------- terminalen skriver
const vila = ms => new Promise(r => setTimeout(r, snabbt ? 0 : ms));
document.addEventListener('pointerdown', e => { if (!e.target.closest('button,a')) snabbt = true; });
const botten = () => window.scrollTo(0, document.body.scrollHeight);
async function skriv(text, klass) {
  const r = el('div', { class: 'l ' + (klass || '') });
  m.append(r);
  for (const c of text) { r.append(c); if (!snabbt) { botten(); await vila(11); } }
  botten();
  await vila(110);
  return r;
}
const tom = () => m.append(el('div', { class: 'l' }, ' '));
const rad = (text, klass) => el('div', { class: 'l ' + (klass || '') }, text);

function skaka() {
  document.body.classList.remove('skak'); void document.body.offsetWidth; document.body.classList.add('skak');
  setTimeout(() => document.body.classList.remove('skak'), 600);
  if (navigator.vibrate) navigator.vibrate([70, 40, 70, 40, 160]);
}

function nedrakning() {
  const ms = new Date(FEST.start) - Date.now();
  if (ms <= 0) return t().nu;
  const s = Math.floor(ms / 1000), tv = n => String(n).padStart(2, '0');
  return `${t().kvar} ${Math.floor(s / 86400)}d ${tv(Math.floor(s / 3600) % 24)}:${tv(Math.floor(s / 60) % 60)}:${tv(s % 60)}`;
}

function karta() {
  const k = el('div', { class: 'karta' });
  k.innerHTML = KARTA;   // fast teckning ur karta.js, inget som kommer utifrån
  k.append(el('a', { href: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(FEST.adress + ', ' + FEST.plats), target: '_blank', rel: 'noopener' }, t().kartor),
           el('span', { class: 'svag' }, ' © OpenStreetMap'));
  return k;
}

// ---------------------------------------------------------------- sida 1: inbjudan och frågan
function valjSprak() {
  return new Promise(klar => {
    const r = el('div', { class: 'l val' }, '> språk / language: ',
      ...['sv', 'en'].map(s => el('button', { onclick: () => {
        sprak = s; try { localStorage.setItem('sprak', s); } catch (e) {}
        document.documentElement.lang = s;
        r.replaceChildren('> språk / language: ' + s); klar();
      } }, `[${s}]`)));
    m.append(r); botten();
  });
}

async function inbjudan() {
  await skriv(`> ${t().identitet}: ${lank.namn.toUpperCase()}`, 'stark');
  if (lank.platser > 1) await skriv(`> ${t().sallskap}: ${t().plus(lank.platser)}`);
  tom();
  await skriv('> ' + t().lana);
  tom();
  await skriv('> ' + t().sakerhet);
  await skriv('> ' + t().hamta);
  tom();
  await skriv('> ' + t().fraga, 'stark');
  return fragan();
}

function fragan() {
  return new Promise(klar => {
    let v = '', last = false, lurad = false;
    const visning = rad('', 'kod'), fel = rad(' ', 'fel'), ledtrad = rad('', 'stark');
    const rita = () => { visning.textContent = `  ${t().svar}: ${v.padEnd(2, '_').split('').join(' ')}`; };
    const tryck = n => {
      if (last) return;
      if (n === '<') { v = v.slice(0, -1); return rita(); }
      if (v.length >= 2) return;
      v += n; rita(); fel.textContent = ' ';
      if (navigator.vibrate) navigator.vibrate(10);
      if (v.length < 2) return;
      const svar = Number(v); v = '';
      if (!lurad && svar === ALDER) {
        lurad = true; skaka();
        fel.textContent = '> ' + t().fel; ledtrad.textContent = '> ' + t().lur;
        return setTimeout(() => { rita(); botten(); }, 600);
      }
      if (svar !== LOGN || !lurad) {
        fel.textContent = '> ' + (lurad ? t().skriv29 : svar < ALDER ? t().aldre : t().yngre);
        return setTimeout(rita, 450);
      }
      last = true; document.removeEventListener('keydown', tangent);
      knappar.remove(); fel.remove();
      klar();
    };
    const tangent = e => { if (/^[0-9]$/.test(e.key)) tryck(e.key); else if (e.key === 'Backspace') tryck('<'); };
    document.addEventListener('keydown', tangent);
    const knappar = el('div', { class: 'tang' },
      ...'123456789'.split('').map(n => el('button', { onclick: () => tryck(n) }, `[${n}]`)),
      el('span'), el('button', { onclick: () => tryck('0') }, '[0]'), el('button', { onclick: () => tryck('<') }, '[<]'));
    rita();
    m.append(visning, knappar, fel, ledtrad); botten();
  });
}

// ---------------------------------------------------------------- övergången: skärmen töms och passerkortet laddas
// ---------------------------------------------------------------- frågan om man kommer
function kommerDu() {
  return new Promise(klar => {
    const knappar = el('div', { class: 'rutor' },
      ...['ja', 'kanske', 'nej'].map(v => el('button', { onclick: () => { knappar.remove(); klar(v); } }, t()[v])));
    m.append(knappar); botten();
  });
}

async function laddaPasserkort() {
  snabbt = false;
  const svar = skicka({ a: 'svar', k: kod, svar: 'ja' });
  await vila(500);
  m.className = 'slack';
  await vila(350);
  m.className = 'mitten';
  const stapel = rad('');
  m.replaceChildren(rad('271126', 'svag'), rad(`> ${t().laddar}`), stapel);
  window.scrollTo(0, 0);
  for (let i = 0; i <= 20; i++) {
    stapel.textContent = `  [${'#'.repeat(i)}${'.'.repeat(20 - i)}] ${String(i * 5).padStart(3)}%`;
    await vila(i < 17 ? 55 : 160);
  }
  const s = await svar;
  if (!s.ok) throw new Error(s.fel);
  lank = s;
  await vila(250);
  m.className = '';
  location.hash = 'kort';
}

async function svaraInte(v) {
  const s = await skicka({ a: 'svar', k: kod, svar: v });
  if (!s.ok) throw new Error(s.fel);
  lank = s;
  tom();
  await skriv('> ' + (v === 'kanske' ? t().kanskeSvar : t().nejSvar), 'stark');
}

// ---------------------------------------------------------------- sida 2: passerkortet
function sparaBildText() {
  const n = lank.platser;
  return [t().pers(n), `${lank.namn.toUpperCase()}${n > 1 ? ' ' + t().plus(n).toUpperCase() : ''}`, t().galler(n), '',
    t().dag, ...FEST.program.map(([tid, vad]) => `${tid}  ${akt(vad)}`), `${FEST.adress.toUpperCase()}, ${FEST.plats.toUpperCase()}`];
}

async function sparaBild(tips) {
  const B = 1080, H = 1720, c = document.createElement('canvas');
  c.width = B; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#050505'; g.fillRect(0, 0, B, H);
  g.fillStyle = '#c8f7c5'; g.font = '40px Menlo, monospace';
  g.fillText(`271126 // ${t().passerkort}`, 70, 110);
  const q = qrcode(0, 'M'); q.addData(location.origin + '/v.html?b=' + kod); q.make();
  const antal = q.getModuleCount(), ruta = Math.floor(860 / (antal + 6)), sida = ruta * (antal + 6), x0 = (B - sida) / 2, y0 = 160;
  g.fillStyle = '#fff'; g.fillRect(x0, y0, sida, sida);
  g.fillStyle = '#000';
  for (let y = 0; y < antal; y++) for (let x = 0; x < antal; x++) if (q.isDark(y, x)) g.fillRect(x0 + (x + 3) * ruta, y0 + (y + 3) * ruta, ruta, ruta);
  let y = y0 + sida + 110;
  sparaBildText().forEach((r, i) => {
    g.fillStyle = i === 0 ? '#eaffea' : '#c8f7c5'; g.font = (i === 0 ? '76px' : '38px') + ' Menlo, monospace';
    g.fillText(r, 70, y); y += i === 0 ? 86 : 54;
  });
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const fil = new File([blob], '271126-passerkort.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [fil] })) {
    tips.textContent = '  ' + t().bildtips;
    try { await navigator.share({ files: [fil] }); } catch (e) {}
    return;
  }
  el('a', { href: URL.createObjectURL(blob), download: '271126-passerkort.png' }).click();
}

const lankAdress = () => location.origin + location.pathname + location.search;
// iPhone, iPad och Mac öppnar kalenderfilen i sin egen kalender. Övriga (Android) får Google Kalender.
const kalender = () => /iPhone|iPad|Macintosh/.test(navigator.userAgent) ? (location.href = '271126.ics') : googleKalender();
const googleKalender = () => window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text=271126&dates=20261127T210000Z/20261128T030000Z'
  + '&location=' + encodeURIComponent(FEST.adress + ', ' + FEST.plats) + '&details=' + encodeURIComponent(lankAdress()), '_blank', 'noopener');
const mejla = () => { location.href = 'mailto:?subject=' + encodeURIComponent(t().amne) + '&body=' + encodeURIComponent(t().mejltext + '\n' + lankAdress()); };

const topp = (titel, knapp) => el('div', { class: 'l topp' }, el('span', {}, `271126 // ${titel}`), knapp);
const sprakknapp = rita => el('button', { onclick: () => { sprak = sprak === 'en' ? 'sv' : 'en'; try { localStorage.setItem('sprak', sprak); } catch (e) {} rita(); } }, sprak === 'en' ? '[sv]' : '[en]');

function visaKort() {
  clearInterval(klocka);
  const n = lank.platser, tips = el('div', { class: 'l svag tips' });
  m.className = 'ny';
  m.replaceChildren(
    topp(t().passerkort, sprakknapp(visaKort)),
    el('div', { class: 'qr' }, qrBild(location.origin + '/v.html?b=' + kod)),
    rad(t().pers(n), 'stor'),
    rad(`> ${lank.namn.toUpperCase()}${n > 1 ? ' ' + t().plus(n).toUpperCase() : ''}`),
    rad('> ' + t().galler(n)),
    ...(n > 1 ? [rad('> ' + t().samma), rad('> ' + t().skarm)] : []),
    rad(' '),
    rad('> ' + t().spara),
    el('div', { class: 'rutor' },
      el('button', { onclick: () => sparaBild(tips) }, t().bild),
      el('button', { onclick: kalender }, t().kal),
      el('button', { onclick: mejla }, t().mejlknapp)),
    tips,
    el('button', { class: 'stor-knapp', onclick: () => { location.hash = 'info'; } }, `[ ${t().infoknapp} ]`));
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- sida 3: info
function visaInfo() {
  clearInterval(klocka);
  const ned = rad('> ' + nedrakning(), 'stark');
  klocka = setInterval(() => { ned.textContent = '> ' + nedrakning(); }, 1000);
  m.className = 'ny';
  m.replaceChildren(
    topp(t().info, sprakknapp(visaInfo)),
    ned,
    rad(' '),
    rad(`> ${t().program}`, 'stark'),
    rad('  ' + t().dag),
    ...FEST.program.map(([tid, vad]) => rad(`  ${tid}  ${akt(vad)}`)),
    rad(' '),
    rad(`> ${t().plats}`, 'stark'),
    rad(`  ${FEST.adress.toUpperCase()}, ${FEST.plats.toUpperCase()}`),
    karta(),
    rad('> ' + t().kladsel),
    el('button', { class: 'stor-knapp', onclick: () => { location.hash = 'kort'; } }, `[ ${t().tillbaka} ]`));
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- start och navigering
function visaSida() {
  if (!lank || lank.svar !== 'ja') return;
  if (location.hash === '#info') visaInfo(); else visaKort();
}
window.addEventListener('hashchange', visaSida);

async function start() {
  await skriv('271126');
  if (!kod) return skriv('> ' + T.sv.ingen + ' / ' + T.en.ingen, 'svag');
  if (!API) return skriv('> ' + T.sv.stangt, 'svag');
  const hamtat = hamta({ a: 'l', k: kod }).catch(() => null);
  if (!sprak) await valjSprak();
  await skriv('> ' + t().ansluter);
  lank = await hamtat;
  if (!lank) return skriv('> ' + t().kontakt, 'fel');
  if (!lank.ok) return skriv('> ' + t().ingen, 'svag');
  await skriv('> ' + t().ok);
  if (lank.svar === 'ja') { await vila(250); location.hash = 'kort'; return visaSida(); }
  if (lank.svar) await skriv('> ' + t().tidigare(lank.svar), 'svag');
  await inbjudan();
  await skriv('> ' + t().godkand, 'stark');
  for (;;) {
    await skriv('> ' + t().kommer, 'stark');
    const v = await kommerDu();
    try { if (v === 'ja') await laddaPasserkort(); else await svaraInte(v); break; }
    catch (e) { m.className = ''; await skriv('> ' + t().kontakt, 'fel'); }
  }
}
if (location.hash) history.replaceState(null, '', location.pathname + location.search);
start();
</script>
</body>
</html>
