// Kartan ritas fram som i en spionfilm: kustlinjen, gatorna en i taget, namnen, och till sist siktet på adressen.
async function byggKarta(k, status) {
  const sv = k.querySelector('svg'), paus = ms => new Promise(r => setTimeout(r, ms));
  const rita = (p, ms) => {
    const L = p.getTotalLength();

  const namn = [...sv.querySelectorAll('.namn text')], har = sv.querySelector('.har');

  const skrivStatus = async text => { status.textContent = ''; for (const c of text) { status.textContent += c; await paus(14); } };
  const [lat, lon] = [59.3239719, 18.0741567];

  if (navigator.vibrate) navigator.vibrate(30);

let ljudCtx = null;
function ton(frekvens, ms, typ = 'square', styrka = .045, start = 0) {
  start += 35;   // liten fördröjning så att ljudet landar samtidigt som det man ser
  try {

    const o = ljudCtx.createOscillator(), g = ljudCtx.createGain(), t0 = ljudCtx.currentTime + start / 1000;
    o.type = typ; o.frequency.value = frekvens;
    g.gain.setValueAtTime(styrka, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + ms / 1000);
    o.connect(g).connect(ljudCtx.destination); o.start(t0); o.stop(t0 + ms / 1000 + .02);
  } catch (e) {}
}

// Kodlåset: en liten skärm med frågan och svaren, siffrorna under, knappsatsen längst ner.
function fragan() {
  return new Promise(klar => {
    let v = '', last = false, lurad = false, skriver = 0, forsok = 0;
    const led = el('i', { class: 'led' });
    const meddelande = el('div', { class: 'lcd-text' });
    const siffror = el('div', { class: 'lcd-siffror' });
    const raknare = el('div', { class: 'lcd-forsok' });
    const skarm = el('div', { class: 'lcd' }, led, raknare, meddelande, siffror);
    // texten på skärmen skrivs fram tecken för tecken, som på en riktig display
    const visa = (text, klass) => {
      const id = ++skriver;
      meddelande.className = 'lcd-text ' + (klass || '');
      meddelande.textContent = '';
      [...text].forEach((c, i) => setTimeout(() => { if (id === skriver) meddelande.textContent += c; }, i * 22));
    };
    const rita = (fel) => {
      siffror.replaceChildren(...[0, 1].map(i => el('span', { class: (v[i] ? 'full' : i === v.length ? 'nasta' : '') + (fel ? ' fel' : '') }, v[i] || '_')));
    };
    const nej = (text) => {
      ljud.fel(); skaka();
      lada.classList.remove('nej'); void lada.offsetWidth; lada.classList.add('nej');
      visa(text, 'fel');
      raknare.textContent = `${t().forsok} ${++forsok}`;
    };
    const tryck = n => {
      if (last) return;
      if (n === '<') { if (v) { v = v.slice(0, -1); ljud.knapp(); } return rita(); }
      if (v.length >= 2) return;
      v += n; rita(); ljud.knapp();
      if (navigator.vibrate) navigator.vibrate(10);
      if (v.length < 2) return;
      const svar = Number(v);
      setTimeout(() => {
        if (!lurad && svar === ALDER) { lurad = true; rita(true); nej(t().lur); v = ''; return setTimeout(() => rita(), 700); }
        // 29 går alltid igenom, även direkt, så den som kommer tillbaka slipper hela leken
        if (svar !== LOGN) {
          rita(true); nej(lurad ? t().skriv29 : svar < LOGN ? t().aldre : t().yngre); v = '';
          return setTimeout(() => rita(), 700);
        }
        last = true; document.removeEventListener('keydown', tangent);
        ljud.ratt(); visa(t().godkand, 'ratt');
        if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
        setTimeout(() => ordSteg(), 900);
      }, 250);
    };
    const tangent = e => { if (/^[0-9]$/.test(e.key)) tryck(e.key); else if (e.key === 'Backspace') tryck('<'); };
    document.addEventListener('keydown', tangent);

    // ---- steg 2: favoritordet, med bokstavstangenter i samma lås
    let ord = '';
    const ordSteg = () => {
      siffror.className = 'lcd-ord';
      const ritaOrd = () => siffror.replaceChildren(el('span', { class: ord ? 'full' : 'nasta' }, ord || '_'));
      ritaOrd();
      visa(t().ordFraga);
      raknare.textContent = '';
      const skrivTecken = c => {
        if (c === '<') { ord = ord.slice(0, -1); ljud.knapp(); return ritaOrd(); }
        if (ord.length >= 14) return;
        ord += c; ljud.knapp(); if (navigator.vibrate) navigator.vibrate(8); ritaOrd();
      };
      const tangentOrd = e => {
        if (e.key === 'Backspace') return skrivTecken('<');
        if (e.key === 'Enter') return skickaOrd();
        if (/^[a-zåäöéü]$/i.test(e.key)) skrivTecken(e.key.toUpperCase());
      };
      document.addEventListener('keydown', tangentOrd);
      const RADER = ['QWERTYUIOPÅ', 'ASDFGHJKLÖÄ', 'ZXCVBNM'];
      const skickaOrd = () => {
        if (ord.length < 2) { ljud.fel(); return visa(t().ordKort, 'fel'); }
        document.removeEventListener('keydown', tangentOrd);
        ljud.ratt(); visa(t().ordTack(ord), 'ratt');
        setTimeout(() => kommerSteg(), 1000);
      };
      knappar.replaceWith(el('div', { class: 'bokstaver' },
        ...RADER.map((rad, i) => el('div', { class: 'brad' }, ...[...rad].map(c => el('button', { onclick: () => skrivTecken(c) }, c)),
          ...(i === 2 ? [el('button', { class: 'bak', onclick: () => skrivTecken('<') }, '←')] : []))),
        el('button', { class: 'skicka', onclick: skickaOrd }, t().skickaIn)));
    };

    // ---- steg 3: ja eller nej, fortfarande i låset
    const kommerSteg = () => {
      siffror.replaceChildren();
      visa(t().kommerLas);
      const val = svar => {
        if (svar === 'ja') { ljud.ratt(); lada.classList.add('ja'); visa(t().beviljad, 'ratt'); }
        else { ljud.fel(); visa(t().nejKort, 'fel'); }
        // låset klickar och fälls ihop till en rad
        setTimeout(() => { ljud.klick(); lada.classList.add('ihop'); }, 900);
        setTimeout(() => { lada.replaceWith(rad(`> ${t().godkand} 29 · ${ord}`, 'stark')); klar({ ord, svar }); }, 1400);
      };
      lada.querySelector('.bokstaver').replaceWith(el('div', { class: 'janej' },
        el('button', { class: 'ja', onclick: () => val('ja') }, t().ja), el('button', { class: 'nej', onclick: () => val('nej') }, t().nej)));
    };

    const knappar = el('div', { class: 'tang' },
      ...'123456789'.split('').map(n => el('button', { onclick: () => tryck(n) }, n)),
      el('span'), el('button', { onclick: () => tryck('0') }, '0'), el('button', { class: 'bak', onclick: () => tryck('<') }, '←'));
    const skylt = el('div', { class: 'skylt' }, el('span', {}, '271126'), el('span', {}, t().modell));
    const lada = el('div', { class: 'kodlas' }, ...['tv', 'th', 'bv', 'bh'].map(p => el('i', { class: 'skruv ' + p })), skylt, skarm, knappar);
    rita();
    m.append(lada); botten();
    setTimeout(() => visa(t().fraga), 250);
  });
}

  const rita = () => {
    prickar.textContent = n > 1 ? bitar.map((_, i) => i + 1 === aktiv ? '●' : '○').join(' ') + (aktiv < n ? `   ${t().svep} →` : '') : '';
    skicka.replaceChildren(...(aktiv > 1 ? [el('button', { onclick: () => skickaTillGast(aktiv, tips) }, ikon('skicka'), el('span', {}, t().skickaTill(fornamn(personNamn(aktiv)))))] : []));
  };
  karusell.addEventListener('scroll', () => {
    const ny = Math.round(karusell.scrollLeft / (bitar[0].offsetWidth + 16)) + 1;
    if (ny !== aktiv) { aktiv = Math.min(n, Math.max(1, ny)); rita(); }
  }, { passive: true });
  const visaBit = i => karusell.scrollTo({ left: (i - 1) * (bitar[0].offsetWidth + 16), behavior: 'smooth' });
  rita();
  m.className = '';
  m.replaceChildren(
    topp(t().passerkort, sprakknapp(visaKort)),
    karusell, prickar, skicka,
    rad(t().pers(n), 'stor'),
    ...(n > 1 ? [rad('> ' + t().enKod), rad('> ' + t().olikaTider, 'svag')] : []),
    rad(' '),
    rad(t().gastlista + (lank.villkor && n > 1 ? `  (plus: ${lank.villkor})` : ''), 'rubrik'),
    el('div', { class: 'lista' }, ...Array.from({ length: n }, (_, i) => {
      const namn = personNamn(i + 1), inne = (lank.inslappta || {})[i + 1];
      // gästernas namn ändras direkt på raden
      const knapp = i > 0 ? [el('button', { class: 'andra' + (namn ? '' : ' saknas'), onclick: async e => {
        e.stopPropagation(); formular.replaceChildren(); await gastFormular(formular); visaKort();
      } }, `[${namn ? t().andraKort : t().laggKort}]`)] : [];
      return el('div', { class: 'post' + (namn ? '' : ' tom'), onclick: () => visaBit(i + 1) }, el('span', { class: 'pnr' }, String(i + 1)),
        el('span', {}, (namn ? namn.toUpperCase() : t().namnSaknas) + (inne ? `  · ${t().inneKl(inne)}` : '')), ...knapp);
    })),
    formular,
    el('button', { class: 'kk-knapp' + (settKladkod() ? '' : ' blink'), onclick: () => { location.hash = 'kladkod'; } }, ikon('galge'), el('span', {}, t().seKladkod)),
    el('button', { class: 'stor-knapp gron', onclick: () => { location.hash = 'info'; } }, ikon('karta'), el('span', {}, t().infoknapp)),
    rad(' '),
    rad('> ' + t().spara),
    el('div', { class: 'rutor' },
      el('button', { onclick: () => sparaBild(tips, aktiv) }, ikon('bild'), el('span', {}, t().bild)),
      el('button', { onclick: kalender }, ikon('kalender'), el('span', {}, t().kal))),
    tips);
  window.scrollTo(0, 0);
}

// Gästens egen länk (?kod-2): bara den egna koden, klädkoden och infon.
function visaGastKort() {
  clearInterval(klocka);
  const i = gastPlats, tips = el('div', { class: 'l svag tips' }), namn = personNamn(i);
  m.className = '';
  m.replaceChildren(
    topp(t().passerkort, sprakknapp(visaGastKort)),
    kortbit(i),
    rad(namn ? namn.toUpperCase() : t().gastTill(lank.namn), 'stor'),
    ...(namn ? [rad('> ' + t().gastTill(lank.namn))] : []),
    el('button', { class: 'kk-knapp' + (settKladkod() ? '' : ' blink'), onclick: () => { location.hash = 'kladkod'; } }, ikon('galge'), el('span', {}, t().seKladkod)),
    el('button', { class: 'stor-knapp gron', onclick: () => { location.hash = 'info'; } }, ikon('karta'), el('span', {}, t().infoknapp)),
    rad(' '),
    rad('> ' + t().spara),
    el('div', { class: 'rutor' },
      el('button', { onclick: () => sparaBild(tips, i) }, ikon('bild'), el('span', {}, t().bild)),
      el('button', { onclick: kalender }, ikon('kalender'), el('span', {}, t().kal))),
    tips);

  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- sida 3: info
function visaInfo() {
  clearInterval(klocka);
  const ned = rad('> ' + nedrakning(), 'stark');
  klocka = setInterval(() => { ned.textContent = '> ' + nedrakning(); }, 1000);
  m.className = '';
  m.replaceChildren(
    topp(t().info, sprakknapp(visaInfo)),
    ned,
    rad(' '),
    rad(`> ${t().program}`, 'stark'),
    rad('  ' + t().dag),
    ...FEST.program.map(([tid, vad]) => rad(`  ${tid}  ${akt(vad)}`)),
    rad(' '),
    rad(`> ${t().plats}`, 'stark'),
    rad(`  ${FEST.adress.toUpperCase()}, ${FEST.plats.toUpperCase()}`),
    karta(true),
    rad('> ' + t().kladsel),
    el('button', { class: 'stor-knapp', onclick: () => { location.hash = 'kort'; } }, `[ ${t().tillbaka} ]`));
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- start och navigering
function visaSida() {
  if (!lank || lank.svar !== 'ja') return;
  if (location.hash === '#info') visaInfo();
  else if (location.hash === '#kladkod') visaKladkod();
  else if (gastPlats) visaGastKort();
  else visaKort();
}
window.addEventListener('hashchange', visaSida);

async function start() {
  await skriv('271126');
  if (!kod) return skriv('> ' + T.sv.ingen + ' / ' + T.en.ingen, 'svag');
  if (!API) return skriv('> ' + T.sv.stangt, 'svag');
  const hamtat = hamta({ a: 'l', k: kod }).catch(() => null);
  // En gäst som fått en länk av sin värd hoppar över språkfrågan: telefonens språk gäller, och knappen uppe till höger byter.
  if (!sprak && gastPlats) sprak = SPRAK.find(k => (navigator.language || '').toLowerCase().startsWith(k)) || 'en';
  if (!sprak) await valjSprak();
  const anslut = await skriv('> ' + t().ansluter);
  // prickar medan vi väntar, så att det syns att något händer
  const prickar = setInterval(() => { anslut.append('.'); }, 700);
  lank = await hamtat;
  clearInterval(prickar);
  if (!lank) return skriv('> ' + t().kontakt, 'fel');
  if (!lank.ok || (gastPlats && gastPlats > lank.platser)) return skriv('> ' + t().ingen, 'svag');
  anslut.append(' ' + t().ok);
  await vila(300);
  if (gastPlats) {
    if (lank.svar !== 'ja') return skriv('> ' + t().inaktiv, 'svag');
    location.hash = 'kort'; return visaSida();
  }
  if (lank.svar === 'ja') { await vila(250); location.hash = 'kort'; return visaSida(); }
  if (lank.svar) await skriv('> ' + t().tidigare(t()[lank.svar] || lank.svar), 'svag');
  const fran = await inbjudan();
  favoritord = fran.ord;
  let v = fran.svar;
  for (;;) {
    try {
      if (v === 'ja' && lank.platser > 1) await gastFormular();
      if (v === 'ja') await laddaPasserkort(); else await svaraInte(v);
      break;
    }
    catch (e) { m.className = ''; await skriv('> ' + t().kontakt, 'fel'); await skriv(t().kommer, 'stor-fraga'); v = await kommerDu(); }
  }
}
if (location.hash) history.replaceState(null, '', location.pathname + location.search);
start();
</script>
