<body>
<h1>271126 – tio spår för gästsidan</h1>
<div class="intro">Varje mobil går att använda. Gör det som står för att tacka ja, så ser du biljetten i samma stil. ”Börja om” återställer. Exemplet är Anna, som får ta med två.</div>
<div class="galler" id="g"></div>
<script src="../docs/qrcode.js"></script>
<script>
const D = { namn: 'Anna', platser: 3, datum: 'Fredag 27 november', adress: 'Pelikansgränd 5', stad: 'Stockholm',
  program: [['22.00', 'Dörrarna öppnar'], ['23.00', 'Dygna'], ['00.00', 'Sonic Butler']] };
const STILLA = new URLSearchParams(location.search).has('stilla'), DIREKT = new URLSearchParams(location.search).has('biljett');
const vila = ms => new Promise(r => setTimeout(r, STILLA ? 0 : ms));

function el(t, a, ...b) { const e = document.createElement(t); for (const [k, v] of Object.entries(a || {})) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); } e.append(...b); return e; }
function qr() {
  const q = qrcode(0, 'M'); q.addData('https://271126.com/v.html?b=exempel1'); q.make();
  const n = q.getModuleCount(), m = 3, s = n + 2 * m; let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x + m} ${y + m}h1v1h-1z`;
  const w = el('div', { class: 'qr' }); w.innerHTML = `<svg viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}"/></svg>`; return w;
}
const rad = (v, h) => el('div', { class: 'r' }, el('span', {}, v), el('span', {}, h || ''));

function biljett(rot, klass) {
  rot.className = 'rot bilj ' + klass;
  rot.replaceChildren(qr(),
    el('div', { class: 'stor' }, '3 personer'),
    el('div', { class: 'und' }, 'Gäller dig och två till. Ni visar samma kod i dörren.'),
    el('div', { class: 'rader' }, ...D.program.map(([t, v]) => rad(v, t)), rad(D.adress, D.stad), rad('Kom som dig själv')));
}

const SPAR = [
  ['01 Rader', 'Den du har sett. Stram, svart, rader som tänds. Håll inne knappen för att tacka ja.', 'v1', (r, klar) => {
    const h = el('button', { class: 'hall' }, el('i'), el('span', {}, 'Håll inne för att tacka ja')); let t;
    h.onpointerdown = () => { h.classList.add('pa'); t = setTimeout(klar, 1000); };
    h.onpointerup = h.onpointerleave = () => { clearTimeout(t); h.classList.remove('pa'); };
    r.append(el('div', { class: 'nr' }, '271126'), el('div', { class: 'b' }, rad(D.datum), rad('45 d 03 h 12 m 08 s')),
      el('div', { class: 'b' }, el('div', { class: 'st' }, 'Anna.'), el('div', { class: 'me' }, 'Du är bjuden. Du får ta med två personer.')),
      el('div', { class: 'b' }, ...D.program.map(([t, v]) => rad(v, t)), rad(D.adress)), el('div', { class: 'b' }, h));
  }],
  ['02 Terminal', 'En gammal dator som skriver ut inbjudan tecken för tecken. Du svarar J eller N vid markören.', 'v2', async (r, klar) => {
    const p = el('pre'); r.append(p);
    const rader = ['> ansluter till 271126 ...', '> identitet: ANNA', '> status: BJUDEN', '> platser: 3 (du + 2)', '', '  2026-11-27  FREDAG', '  22:00  dörrarna öppnar', '  23:00  DYGNA', '  00:00  SONIC BUTLER', '', '  PELIKANSGRÄND 5, STOCKHOLM', '', '> kommer du? [J/N]'];
    for (const l of rader) { for (const c of l) { p.append(c); await vila(14); } p.append('\n'); await vila(120); }
    r.append(el('div', { class: 'val' }, el('button', { onclick: klar }, '[ J ]'), el('button', {}, '[ N ]'), el('span', { class: 'mark' })));
  }],
  ['03 Kopia', 'Kopierat flygblad från en lyktstolpe. Brus, sneda remsor, feta siffror. Tryck för att stämpla JA.', 'v3', (r, klar) => {
    const ja = el('div', { class: 'ja' }, 'JA');
    r.append(el('div', {}, 'Till Anna + 2'), el('div', { class: 'jatte' }, '27.11'), el('div', { class: 'band' }, 'Pelikansgränd 5'),
      el('div', { class: 'lista' }, ...D.program.map(([t, v]) => el('div', {}, el('span', {}, v), el('span', {}, t)))),
      el('button', { class: 'stpl', onclick: () => { ja.classList.add('pa'); setTimeout(klar, 900); } }, 'Tryck här för att stämpla'), ja);
  }],
  ['04 Dörrkod', 'En kodlås vid en omärkt dörr. Inget står förklarat. Koden är datumet: slå 271126 för att komma in.', 'v4', (r, klar) => {
    let v = ''; const d = el('div', { class: 'disp' }, '······');
    const visa = () => { d.textContent = v.padEnd(6, '·'); };
    const tryck = n => { if (v.length >= 6) return; v += n; visa();
      if (v.length === 6) { if (v === '271126') { d.classList.add('ok'); setTimeout(klar, 700); } else { d.classList.add('fel'); setTimeout(() => { v = ''; visa(); d.classList.remove('fel'); }, 450); } } };
    r.append(el('div', {}, 'Anna'), d, el('div', { class: 'tang' }, ...'123456789'.split('').map(n => el('button', { onclick: () => tryck(n) }, n)), el('span'), el('button', { onclick: () => tryck('0') }, '0')),
      el('div', { class: 'tips' }, 'Koden är datumet'));
  }],
  ['05 Ett ord', 'Ett ord per skärm, enormt, svart och vitt om vartannat. Tryck för nästa. Sist delas skärmen i JA och NEJ.', 'v5', (r, klar) => {
    const ord = ['Anna.', 'Du är bjuden.', 'Fredag 27 nov.', '22.00', 'Dygna 23.00', 'Sonic Butler 00.00', 'Pelikans­gränd 5', 'Ta med två.'];
    let i = 0; const o = el('div', { class: 'ord' }), s = el('small'), t = el('div', { class: 'tryck' }, 'Tryck');
    const visa = () => { o.innerHTML = ord[i]; s.textContent = `${i + 1}/${ord.length + 1}`; r.classList.toggle('inv', i % 2 === 1); };
    r.append(s, t, o); visa();
    r.onclick = () => { if (++i < ord.length) return visa();
      r.onclick = null; r.append(el('div', { class: 'halvor' }, el('button', { class: 'j', onclick: e => { e.stopPropagation(); klar(); } }, 'Ja'), el('button', { class: 'n' }, 'Nej'))); };
  }],
  ['06 Stubben', 'En riktig pappersbiljett med perforering och streckkod. Dra reglaget åt höger för att riva av stubben.', 'v6', (r, klar) => {
    const stub = el('div', { class: 'kort6 stub' }), knopp = el('b', {}, '→'), dra = el('div', { class: 'dra' }, el('span', {}, 'Dra för att riva'), knopp);
    let x0 = null;
    knopp.onpointerdown = e => { x0 = e.clientX; knopp.setPointerCapture(e.pointerId); };
    knopp.onpointermove = e => { if (x0 == null) return; const dx = Math.max(0, Math.min(dra.clientWidth - 46, e.clientX - x0)); knopp.style.left = dx + 'px';
      if (dx >= dra.clientWidth - 50) { x0 = null; stub.classList.add('riven'); setTimeout(klar, 550); } };
